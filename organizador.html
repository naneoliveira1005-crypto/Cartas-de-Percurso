<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesquisadora | Cartas de Percurso</title><style>
body{font-family:Arial,sans-serif;background:#f4efe6;color:#262626;margin:0}.w{max-width:1000px;margin:auto;padding:28px}h1{color:#173d34;font-family:Georgia,serif}.top,.card,.detail{background:#fff;border:1px solid #d9c79f;border-radius:16px;padding:18px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats b{font-size:30px;color:#173d34;display:block}.row{display:grid;grid-template-columns:70px 1fr 130px 90px;gap:10px;align-items:center}.tag{padding:6px 9px;border-radius:999px;background:#eee;font-size:12px}.enviada{background:#e7f3ec}.rascunho{background:#fff2cf}button{border:0;border-radius:999px;background:#173d34;color:white;padding:9px 14px;font-weight:700;cursor:pointer}.detail{display:none}.detail.show{display:block}.box{white-space:pre-wrap;line-height:1.6;background:#fffaf1;border:1px solid #d9c79f;border-radius:10px;padding:14px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:60px 1fr 80px}.st{display:none}}
</style></head><body><main class="w"><div class="top"><h1>Cartas de Percurso</h1><p>Área privada da pesquisadora. Leitura e acompanhamento sem alteração das cartas lacradas.</p></div><div id="app">Carregando...</div><div id="detail" class="detail"></div></main><script>
const U="https://zpsjuxusydfbptjotyxo.supabase.co",K="sb_publishable_n7giA7FAUqRmj1zv2JF8og_VQbjrxa7";
const q=new URLSearchParams(location.hash.slice(1)),ch=q.get("chave")||"",app=document.getElementById("app"),detail=document.getElementById("detail");
const esc=s=>String(s??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const fmt=d=>d?new Date(d).toLocaleString("pt-BR"):"—";
fetch(U+"/rest/v1/rpc/pesquisadora_painel",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({p_chave:ch})}).then(async r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
window.D=d;const s=d.resumo||{},p=d.participantes||[];
app.innerHTML='<div class="stats"><div class="card"><b>'+s.total+'</b>Total</div><div class="card"><b>'+s.abertas+'</b>Abriram</div><div class="card"><b>'+s.rascunhos+'</b>Rascunhos</div><div class="card"><b>'+s.enviadas+'</b>Enviadas</div></div>'+p.map(x=>'<div class="card row"><b>'+esc(x.codigo)+'</b><div>'+esc(x.nome)+'<div style="font-size:12px;color:#777">Acesso: '+fmt(x.primeiro_acesso_em)+'</div></div><span class="tag '+x.status+'">'+(x.status==="enviada"?"Enviada":x.status==="rascunho"?"Rascunho":"Não iniciada")+'</span><button onclick="ver(\''+x.codigo+'\')">Ver</button></div>').join("");
}).catch(()=>app.innerHTML='<div class="card">Acesso não autorizado. Use o link privado da pesquisadora.</div>');
function ver(c){const x=D.participantes.find(y=>y.codigo===c);detail.innerHTML='<button onclick="detail.classList.remove(\'show\')">Fechar</button><h1>'+esc(x.nome)+'</h1><h3>Mensagem personalizada</h3><div class="box">'+esc(x.mensagem||"Ainda não definida.")+'</div><h3>Algo me fez lembrar de você</h3><p><b>'+esc(x.presente_tipo||"")+'</b> '+esc(x.presente_titulo||"")+'</p><div class="box">'+esc(x.presente_motivo||"Ainda não definido.")+'</div><h3>Carta da participante</h3><p>Enviada em: '+fmt(x.enviado_em)+'</p><div class="box">'+esc(x.texto||"Ainda não há texto registrado.")+'</div>';detail.classList.add("show");detail.scrollIntoView({behavior:"smooth"})}
</script></body></html>
