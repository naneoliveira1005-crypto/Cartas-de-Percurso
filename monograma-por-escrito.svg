<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
<title id="title">Monograma NO de Por Escrito</title>
<desc id="desc">As letras N e O se entrelaçam em traços elegantes de bronze e dourado.</desc>
<defs>
<linearGradient id="metal" x1="0" x2="1" y1="0.15" y2="0.9">
<stop offset="0" stop-color="#7b5427"/><stop offset=".14" stop-color="#d3a65c"/><stop offset=".27" stop-color="#f4dda8"/><stop offset=".43" stop-color="#ae7936"/><stop offset=".59" stop-color="#f2d08b"/><stop offset=".79" stop-color="#91602d"/><stop offset="1" stop-color="#dec188"/>
</linearGradient>
<linearGradient id="highlight" x1="0" x2=".95" y1="0" y2="1"><stop stop-color="#ffedbf"/><stop offset=".45" stop-color="#b78a49"/><stop offset="1" stop-color="#75512b"/></linearGradient>
<filter id="shadow" x="-15%" y="-20%" width="135%" height="150%"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#543d22" flood-opacity=".28"/></filter>
</defs>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
<!-- an oval O with a deliberately asymmetric fine-to-bold stroke -->
<path d="M336 48 C411 52 449 105 441 173 C434 237 379 280 306 272 C244 266 216 217 226 151 C236 89 272 48 336 48Z" stroke="url(#metal)" stroke-width="17"/>
<path d="M333 57 C396 58 432 104 429 166 C427 232 373 268 314 261" stroke="#fff2c2" stroke-opacity=".7" stroke-width="2.2"/>
<!-- long fine N serifs and vertical strokes -->
<path d="M97 256 Q119 254 141 256 M103 46 Q127 48 151 46 M116 51 L116 250" stroke="url(#metal)" stroke-width="12"/>
<path d="M115 57 L116 244" stroke="#ffebbc" stroke-opacity=".66" stroke-width="1.8"/>
<path d="M118 59 C143 78 173 118 205 160 C236 203 266 236 294 256" stroke="url(#metal)" stroke-width="22"/>
<path d="M124 65 C151 88 181 127 209 165 C244 213 271 242 294 253" stroke="#ffedbd" stroke-width="2" stroke-opacity=".66"/>
<path d="M294 60 Q307 54 322 56 M305 58 L305 155" stroke="url(#metal)" stroke-width="11"/>
<!-- original calligraphic bridge making N and O one symbol -->
<path d="M68 176 C96 130 157 133 213 168 C273 208 323 230 370 219" stroke="url(#highlight)" stroke-width="9"/>
<path d="M70 173 C104 133 164 142 215 173 C273 212 328 230 368 220" stroke="#f8e4a9" stroke-width="1.7" stroke-opacity=".75"/>
</g>
<path d="M414 67 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#d6b47c" opacity=".85"/>
</svg>